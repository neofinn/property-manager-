<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Property Manager</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <button class="menu-btn" id="menu-btn" aria-label="Toggle menu">☰</button>
    <h1>Property Manager</h1>
  </header>
  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Sections"></nav>
    <main id="main" tabindex="-1"></main>
  </div>

  <dialog id="dialog">
    <form id="record-form" method="dialog" novalidate>
      <header class="dialog-head">
        <h2 id="dialog-title"></h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">✕</button>
      </header>
      <div class="form-error" id="form-error" hidden></div>
      <div class="form-grid" id="form-fields"></div>
      <footer class="dialog-foot">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn primary" id="save-btn">Save</button>
      </footer>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
